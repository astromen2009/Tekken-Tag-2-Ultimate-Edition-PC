# TTT2 Ultimate Launcher for Windows, TTT2-Launcher-Windows-<version>.exe: the players' window
# (windows/launcher/ttt2_launcher.py: play, update the game and the launcher from this repository's releases, add
# Tekken 7's fighters with tools/characters), frozen with PyInstaller with numpy, Pillow and t7helper.exe, packed with
# Inno Setup. A tag launcher-v<version> (or a release published with one) publishes it; any other run keeps it as
# the run's artifact. Nothing of either game is built or shipped here.
name: Windows launcher

on:
  push:
    tags: ["launcher-v*"]
    branches: [windows-port]
    paths: ["tools/characters/**", "windows/launcher/**", ".github/workflows/windows-launcher.yml"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: windows-launcher-${{ github.ref }}

permissions:
  contents: write

jobs:
  launcher:
    # (a release of the game's installer is windows-installer.yml's)
    if: github.event_name != 'release' || startsWith(github.ref, 'refs/tags/launcher-v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: t7helper.exe
        shell: msys2 {0}
        run: gcc -O2 -mwindows -static -o t7helper.exe tools/characters/t7helper/t7helper.c -lws2_32

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: python -m pip install pyinstaller numpy pillow

      - name: The importer's Windows parts
        run: python windows/launcher/ci_check.py

      - name: Version
        id: version
        shell: bash
        run: |
          version=0.0.0-dev
          if [[ "$GITHUB_REF" == refs/tags/launcher-v* ]]; then version="${GITHUB_REF#refs/tags/launcher-v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # (what the launcher compares the releases with, and where it looks for them)
          printf 'version = %s\nrepository = %s\n' "$version" "$GITHUB_REPOSITORY" > launcher.ini

      - name: Freeze
        run: >-
          pyinstaller --noconfirm --windowed --name "TTT2 Ultimate Launcher"
          --paths tools/characters --hidden-import import_character --collect-submodules ttt2char
          --add-binary "t7helper.exe;." --add-data "launcher.ini;." windows/launcher/ttt2_launcher.py

      - name: Check the frozen program
        shell: pwsh
        run: |
          $out = & "dist\TTT2 Ultimate Launcher\TTT2 Ultimate Launcher.exe" --run-import --help 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch "usage: import_character") { exit 1 }

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DSourceDir=$PWD\dist\TTT2 Ultimate Launcher" "/DAppVersion=${{ steps.version.outputs.version }}" "/DOutputDir=$PWD\installer" windows\launcher\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: TTT2-Launcher-Windows
          path: installer/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*.exe
          name: TTT2 Ultimate Launcher ${{ steps.version.outputs.version }} - Windows
          body_path: windows/launcher/RELEASE.md
