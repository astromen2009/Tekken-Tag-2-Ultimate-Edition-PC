# TTT2 Fighters for Windows, TTT2-Fighters-Windows-<version>.exe: the character importer (tools/characters) behind
# a window (windows/fighters/ttt2_fighters.py), frozen with PyInstaller with numpy, Pillow and t7helper.exe, packed
# with Inno Setup. A tag fighters-v<version> (or a release published with one) publishes it; any other run keeps it
# as the run's artifact. Nothing of either game is built or shipped here.
name: Windows fighters importer

on:
  push:
    tags: ["fighters-v*"]
    branches: [windows-port]
    paths: ["tools/characters/**", "windows/fighters/**", ".github/workflows/windows-fighters.yml"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: windows-fighters-${{ github.ref }}

permissions:
  contents: write

jobs:
  fighters:
    # (a release of the game's installer is windows-installer.yml's)
    if: github.event_name != 'release' || startsWith(github.ref, 'refs/tags/fighters-v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: t7helper.exe
        shell: msys2 {0}
        run: gcc -O2 -mwindows -static -o t7helper.exe tools/characters/t7helper/t7helper.c -lws2_32

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: python -m pip install pyinstaller numpy pillow

      - name: The importer's Windows parts
        run: python windows/fighters/ci_check.py

      - name: Freeze
        run: >-
          pyinstaller --noconfirm --windowed --name "TTT2 Fighters"
          --paths tools/characters --hidden-import import_character --collect-submodules ttt2char
          --add-binary "t7helper.exe;." windows/fighters/ttt2_fighters.py

      - name: Check the frozen program
        shell: pwsh
        run: |
          $out = & "dist\TTT2 Fighters\TTT2 Fighters.exe" --run-import --help 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch "usage: import_character") { exit 1 }

      - name: Version
        id: version
        shell: bash
        run: |
          version=dev
          if [[ "$GITHUB_REF" == refs/tags/fighters-v* ]]; then version="${GITHUB_REF#refs/tags/fighters-v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DSourceDir=$PWD\dist\TTT2 Fighters" "/DAppVersion=${{ steps.version.outputs.version }}" "/DOutputDir=$PWD\installer" windows\fighters\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: TTT2-Fighters-Windows
          path: installer/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/fighters-v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*.exe
          name: TTT2 Fighters ${{ steps.version.outputs.version }} - Windows
          body_path: windows/fighters/RELEASE.md
